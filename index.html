<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0D10" />
  <title>ForjeFit — Treino & Biomecânica</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/styles/app.css" />
  <script>
    window.addEventListener('error', function (e) {
      var box = document.getElementById('boot-err') || document.body.appendChild(Object.assign(document.createElement('pre'), {
        id: 'boot-err',
        style: 'position:fixed;inset:12px;z-index:99999;background:#14171C;color:#FF5F00;padding:14px;border-radius:12px;white-space:pre-wrap;font-size:12px;overflow:auto'
      }));
      box.textContent += 'Falha: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'recurso não encontrado') + '\n';
    }, true);
  </script>
</head>
<body style="margin:0;background:#0B0D10;color:#F8FAFC;font-family:sans-serif">
  <div id="app-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
