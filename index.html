<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ForgeFit — App Fitness Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-top: #211208;
            --bg-base: #070605;
            --surface: #14100D;
            --surface-2: #1E1712;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --neon: #FF6A00;
            --neon-soft: rgba(255, 106, 0, 0.16);
            --neon-glow: rgba(255, 106, 0, 0.48);
            --neon-border: rgba(255, 106, 0, 0.42);
        }
        body.theme-green {
            --bg-top: #07211B;
            --bg-base: #030D0D;
            --surface: #0C1C1C;
            --surface-2: #132828;
            --neon: #2EE600;
            --neon-soft: rgba(46, 230, 0, 0.15);
            --neon-glow: rgba(46, 230, 0, 0.45);
            --neon-border: rgba(46, 230, 0, 0.42);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: #050505;
            color: #F8F5F2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .phone-shell {
            width: 100%;
            max-width: 420px;
            min-height: 780px;
            height: calc(100vh - 54px);
            max-height: 870px;
            background: radial-gradient(circle at 50% 0%, var(--bg-top) 0%, var(--bg-base) 58%);
            border-radius: 36px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 460px) {
            .phone-shell {
                border-radius: 0;
                border: none;
                height: calc(100vh - 46px);
                max-height: none;
            }
        }

        .surface-card {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
        }
        .surface-card-2 {
            background: var(--surface-2);
            border: 1px solid var(--border-subtle);
        }
        .text-neon { color: var(--neon); }
        .bg-neon { background-color: var(--neon); }
        .bg-neon-soft { background-color: var(--neon-soft); }
        .border-neon { border-color: var(--neon) !important; }
        .border-neon-soft { border-color: var(--neon-border) !important; }
        .neon-btn {
            background: var(--neon);
            color: #090909;
            box-shadow: 0 8px 26px var(--neon-glow);
            transition: transform 0.14s ease, filter 0.15s ease;
        }
        .neon-btn:active { transform: scale(0.97); }
        .neon-card-active {
            background: linear-gradient(135deg, var(--neon-soft), var(--surface));
            border: 1.5px solid var(--neon) !important;
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.14);
        }
        .injury-active {
            background: rgba(239, 68, 68, 0.16);
            border: 1.5px solid #EF4444 !important;
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.28);
        }

        /* Animações */
        @keyframes slideInRight { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
        @keyframes drawCurve { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
        @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        @keyframes marqueeRev { from { transform: translateX(-50%); } to { transform: translateX(0); } }
        @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 14px var(--neon-glow); } 50% { box-shadow: 0 0 30px var(--neon-glow); } }
        @keyframes barBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes legSwing { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-32deg); } }
        @keyframes curlSwing { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-48deg); } }
        @keyframes squatMove { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(520px) rotate(540deg); opacity: 0; }
        }

        .anim-next { animation: slideInRight 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
        .anim-prev { animation: slideInLeft 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
        .anim-pop { animation: popIn 0.26s ease-out; }
        .anim-grow { transform-origin: bottom; animation: growUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .anim-curve { stroke-dasharray: 600; stroke-dashoffset: 600; animation: drawCurve 1.2s ease forwards; }
        .anim-float { animation: floatY 2.8s ease-in-out infinite; }
        .anim-pulse-glow { animation: pulseGlow 2.2s ease-in-out infinite; }
        .marquee-track { display: flex; width: max-content; animation: marquee 16s linear infinite; }
        .marquee-track-rev { display: flex; width: max-content; animation: marqueeRev 18s linear infinite; }
        .tape-track { display: flex; width: max-content; animation: marquee 9s linear infinite; }

        .anim-ex-bench { animation: barBounce 1.4s ease-in-out infinite; }
        .anim-ex-leg { transform-origin: 48px 46px; animation: legSwing 1.5s ease-in-out infinite; }
        .anim-ex-curl { transform-origin: 44px 42px; animation: curlSwing 1.4s ease-in-out infinite; }
        .anim-ex-squat { animation: squatMove 1.5s ease-in-out infinite; }

        /* Roda de Idade e Régua */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .ruler-scroll { overflow-x: auto; scroll-behavior: auto; -webkit-overflow-scrolling: touch; cursor: grab; user-select: none; }
        .ruler-scroll:active { cursor: grabbing; }
        .ruler-needle {
            position: absolute; left: 50%; top: 4px; transform: translateX(-50%);
            width: 4px; height: 48px; border-radius: 99px;
            background: var(--neon); box-shadow: 0 0 16px var(--neon-glow);
            pointer-events: none; z-index: 10;
        }

        /* Linhas conectadas do Mapa Corporal */
        .connector-line { fill: none; stroke-width: 1.8; transition: stroke 0.25s ease, opacity 0.25s ease; }
        .muscle-part { transition: fill 0.25s ease, filter 0.25s ease, opacity 0.25s ease; }
    </style>
</head>

        <!-- ==================== PAINEL ADMIN ==================== -->
        <div id="modal-admin" class="hidden absolute inset-0 z-50 flex flex-col overflow-hidden" style="background: #0B0908;">

            <div id="admin-body" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar"></div>

    </main>

        // MOTOR INTELIGENTE DE PLANO, SÉRIES, REPETIÇÕES E CARGAS
        // =========================================================================
        function calcularPrescricaoExercicio(ex, idx) {
            const u = STATE.user;
            const goalMap = {
                'Ficar Mais Forte': { sets: 4, reps: 6, wMult: 1.25, rest: 120 },
                'Ganhar Músculos': { sets: 4, reps: 10, wMult: 1.0, rest: 90 },
                'Definir o Corpo': { sets: 3, reps: 14, wMult: 0.85, rest: 60 },
                'Melhorar Condicionamento': { sets: 3, reps: 18, wMult: 0.72, rest: 45 }
            }[u.goal] || { sets: 4, reps: 10, wMult: 1.0, rest: 90 };

            const expMap = {
                'Iniciante': { setDelta: -1, wMult: 0.65 },
                'Intermediário': { setDelta: 0, wMult: 1.0 },
                'Avançado': { setDelta: 1, wMult: 1.3 },
                'Especialista': { setDelta: 1, wMult: 1.55 }
            }[u.experience] || { setDelta: 0, wMult: 1.0 };

            const bodyFactor = Math.max(0.65, Math.min(1.45, (u.weightKg || 75) / 75));
            const genderFactor = u.gender === 'Feminino' ? 0.78 : 1.0;

            let sets = Math.max(3, Math.min(5, goalMap.sets + expMap.setDelta));
            if (idx === 0) sets = Math.min(5, sets + 1);
            const reps = ex.muscle === 'Abdômen' && ex.baseWeight === 0 ? (u.experience === 'Iniciante' ? 30 : 45) : goalMap.reps;
            let weight = 0;
            if (ex.baseWeight > 0 && u.location !== 'Peso Corporal') {
                weight = Math.max(4, Math.round((ex.baseWeight * goalMap.wMult * expMap.wMult * bodyFactor * genderFactor) / 2) * 2);
            }
            const tag = idx === 0 ? 'C/ AQUECIMENTO' : (ex.region === 'Abdômen' ? 'CORE' : '');
            return { ...ex, sets, reps, weight, rest: goalMap.rest, tag };
        }

        function gerarPlanoPersonalizado() {
            const u = STATE.user;
            const injuredRegions = mapInjuriesToRegions();
            let allowedRegions = u.focusMuscles.filter(r => !injuredRegions.includes(r));
            if (allowedRegions.length === 0) allowedRegions = ['Abdômen'];

            // Filtra ESTRITAMENTE pelas regiões focadas e sem lesões
            let pool = STATE.exercises.filter(ex => {
                const regionOk = allowedRegions.includes(ex.region);
                const noInjury = !(ex.injuryKeys || []).some(k => u.injuries.includes(k));
                const locOk = !ex.locs || ex.locs.includes(u.location);
                return regionOk && noInjury && locOk;
            });

            if (pool.length < 3) {
                pool = STATE.exercises.filter(ex => {
                    const regionOk = allowedRegions.includes(ex.region);
                    const noInjury = !(ex.injuryKeys || []).some(k => u.injuries.includes(k));
                    return regionOk && noInjury;
                });
            }

            const byRegion = {};
            allowedRegions.forEach(r => {
                const list = pool.filter(e => e.region === r);
                if (list.length) byRegion[r] = list;
            });
            const availRegions = Object.keys(byRegion);
            const numDays = Math.max(1, Math.min(7, u.daysPerWeek || 4));
            const perDayCount = u.experience === 'Iniciante' ? 4 : (u.experience === 'Intermediário' ? 5 : 6);

            const pushRegs = ['Peito', 'Ombros', 'Braços'].filter(r => availRegions.includes(r));
            const pullRegs = ['Costas', 'Braços', 'Abdômen'].filter(r => availRegions.includes(r));
            const legRegs = ['Pernas', 'Glúteos', 'Abdômen'].filter(r => availRegions.includes(r));
            const upperRegs = ['Peito', 'Costas', 'Ombros', 'Braços'].filter(r => availRegions.includes(r));

            const candidateSplits = [];
            if (pushRegs.length) candidateSplits.push({ title: `Dia de ${pushRegs.slice(0, 2).join(' e ')}`, regs: pushRegs });
            if (pullRegs.length) candidateSplits.push({ title: `Dia de ${pullRegs.slice(0, 2).join(' e ')}`, regs: pullRegs });
            if (legRegs.length) candidateSplits.push({ title: `Dia de ${legRegs.slice(0, 2).join(' e ')}`, regs: legRegs });
            if (upperRegs.length) candidateSplits.push({ title: 'Dia de Superior Completo', regs: upperRegs });
            if (!candidateSplits.length) candidateSplits.push({ title: `Treino de ${availRegions.join(' + ')}`, regs: availRegions });

            const plan = [];
            for (let d = 0; d < numDays; d++) {
                const tpl = candidateSplits[d % candidateSplits.length];
                let dayPool = [];
                tpl.regs.forEach(r => { if (byRegion[r]) dayPool.push(...byRegion[r]); });
                if (dayPool.length < perDayCount) {
                    pool.forEach(ex => { if (!dayPool.find(x => x.id === ex.id)) dayPool.push(ex); });
                }
                const picked = dayPool.slice(0, Math.min(perDayCount, dayPool.length)).map((ex, idx) => calcularPrescricaoExercicio(ex, idx));
                const regionsInDay = [...new Set(picked.map(x => x.region))];
                const dynamicTitle = regionsInDay.length <= 2 ? `Treino de ${regionsInDay.join(' e ')}` : tpl.title;
                plan.push({ dayIdx: d, label: `DIA ${d + 1}`, title: dynamicTitle, regions: regionsInDay, exercises: picked });
            }

            STATE.generatedPlan = plan;
            if (plan[0] && plan[0].exercises[0]) STATE.user.restSeconds = plan[0].exercises[0].rest;
            if (STATE.activeDay >= plan.length) STATE.activeDay = 0;
            return plan;
        }

        // Régua Deslizante Real (Touch + Mouse Drag Suave e Preciso)
        function montarReguaDeslizante({ elId, min, max, step, initial, pxPerTick, majorEvery, labelFn, onChange }) {
            setTimeout(() => {
                const el = document.getElementById(elId);
                if (!el) return;
                const totalSteps = Math.round((max - min) / step);
                const pad = Math.floor(el.clientWidth / 2);

                let html = `<div style="min-width:${pad}px; flex-shrink:0;"></div>`;
                for (let i = 0; i <= totalSteps; i++) {
                    const val = +(min + i * step).toFixed(2);
                    const isMajor = i % majorEvery === 0;
                    const isMid = !isMajor && i % Math.max(2, Math.floor(majorEvery / 2)) === 0;
                    html += `
                        <div style="width:${pxPerTick}px; flex-shrink:0;" class="flex flex-col items-center justify-end relative">
                            ${isMajor ? `<span class="text-[10px] font-bold text-gray-400 mb-2 select-none whitespace-nowrap">${labelFn(val)}</span>` : ''}
                            <div class="w-[2px] rounded-full ${isMajor ? 'h-9 bg-gray-300' : (isMid ? 'h-6 bg-gray-500' : 'h-4 bg-gray-600')}"></div>
                        </div>`;
                }
                html += `<div style="min-width:${pad}px; flex-shrink:0;"></div>`;
                el.innerHTML = html;

                const initIdx = Math.round((initial - min) / step);
                el.scrollLeft = initIdx * pxPerTick;

                let lastVal = initial;
                el.onscroll = () => {
                    const idx = Math.min(totalSteps, Math.max(0, Math.round(el.scrollLeft / pxPerTick)));
                    const v = +(min + idx * step).toFixed(2);
                    if (v !== lastVal) {
                        lastVal = v;
                        onChange(v);
                    }
                };

                let dragging = false, startX = 0, startScroll = 0;
                el.onmousedown = e => { dragging = true; startX = e.pageX; startScroll = el.scrollLeft; };
                window.addEventListener('mouseup', () => { dragging = false; });
                el.onmousemove = e => {
                    if (!dragging) return;
                    e.preventDefault();
                    el.scrollLeft = startScroll - (e.pageX - startX);
                };
            }, 30);
        }

        function atualizarMetaPesoSuave(val) {
            const target = parseFloat(val);
            STATE.user.targetWeightKg = target;
            const diffPct = Math.round(((target - STATE.user.weightKg) / STATE.user.weightKg) * 100);
            const isLoss = diffPct <= 0;
            const fmt = target.toFixed(1).replace('.', ',');

            const tEl = document.getElementById('meta-title-val');
            const bEl = document.getElementById('meta-badge-val');
            const pEl = document.getElementById('meta-pct-lbl');
            const area = document.getElementById('meta-area');
            const line = document.getElementById('meta-line');
            const c1 = document.getElementById('meta-c1');
            const c2 = document.getElementById('meta-c2');

            if (tEl) tEl.textContent = `${fmt} kg`;
            if (bEl) bEl.textContent = `${fmt} KG`;
            if (pEl) pEl.textContent = diffPct === 0 ? 'Manter peso' : (diffPct > 0 ? `+${diffPct}% massa` : `${diffPct}% gordura`);

            const delta = Math.max(-25, Math.min(25, target - STATE.user.weightKg));
            const startY = 62;
            const endY = Math.max(18, Math.min(106, Math.round(62 - delta * 1.7)));
            const midY = Math.round((startY + endY) / 2 + (isLoss ? 8 : -8));
            const dLine = `M15,${startY} C95,${startY} 165,${midY} 285,${endY}`;
            if (line) { line.classList.remove('anim-curve'); line.setAttribute('d', dLine); }
            if (area) area.setAttribute('d', `${dLine} L285,125 L15,125 Z`);
            if (c1) c1.setAttribute('cy', startY);
            if (c2) c2.setAttribute('cy', endY);
        }

            document.getElementById('ex-sets').innerHTML = Array.from({ length: setsCount }, (_, i) => `
                <div id="sr-${i}" class="grid grid-cols-4 items-center px-3 py-2.5 rounded-2xl surface-card text-xs">
                    <span class="font-black">${i + 1}</span><span>${repsCount}</span><span>${weightVal}</span>
                    <div class="flex justify-end"><button id="sb-${i}" onclick="checkSerie(${i},${repsCount},${weightVal})" class="w-8 h-8 rounded-full surface-card-2 text-gray-400 font-black">✓</button></div>
                </div>`).join('');
            document.getElementById('modal-ex').classList.remove('hidden');
        }

        function fecharExercicio() {
            clearInterval(restInterval);
            document.getElementById('modal-ex').classList.add('hidden');
        }

        function toggleFavAtual() {
            const ex = STATE.exercises.find(e => e.id === STATE.activeExId);
            if (!ex) return;
            ex.fav = !ex.fav;
            gerarPlanoPersonalizado();
            document.getElementById('ex-fav').textContent = ex.fav ? '★' : '☆';
            document.getElementById('ex-fav').className = `w-9 h-9 rounded-full surface-card-2 text-lg ${ex.fav ? 'text-neon' : 'text-gray-400'}`;
            mostrarToast(ex.fav ? 'Adicionado aos favoritos ★' : 'Removido dos favoritos');
        }

        function checkSerie(i, reps, weight) {
            const row = document.getElementById('sr-' + i);
            const btn = document.getElementById('sb-' + i);
            if (!row || !btn || btn.dataset.done === '1') return;
            btn.dataset.done = '1';
            row.className = 'grid grid-cols-4 items-center px-3 py-2.5 rounded-2xl neon-card-active text-xs';
            btn.className = 'w-8 h-8 rounded-full bg-neon text-black font-black';
            STATE.stats.totalReps += reps;
            STATE.stats.totalVolume += reps * (weight || 10);
            STATE.stats.totalKcal += 12;
            iniciarDescanso();
        }

        function formatSec(s) {
            return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        }

        function iniciarDescanso() {
            clearInterval(restInterval);
            let left = STATE.user.restSeconds || 90;
            const el = document.getElementById('rest-clock');
            if (el) el.textContent = formatSec(left);
            restInterval = setInterval(() => {
                left--;
                if (el) el.textContent = formatSec(Math.max(0, left));
                if (left <= 0) {
                    clearInterval(restInterval);
                    mostrarToast('Descanso finalizado! Próxima série 💪');
                }
            }, 1000);
        }

        function concluirDiaAtual() {
            if (!STATE.completedDays.includes(STATE.activeDay)) {
                STATE.completedDays.push(STATE.activeDay);
                STATE.stats.workoutsDone++;
            }
            fecharExercicio();
            renderAppTab();
            mostrarToast('Exercício registrado! Evolução atualizada 🔥');
        }

        // =========================================================================
        // PAINEL ADMINISTRADOR (GIFs, TELAS, FOTOS/AVALIAÇÕES, PUSH E CUPONS)
        // =========================================================================
        function abrirAdmin(tab = 'ob') {
            document.getElementById('modal-admin').classList.remove('hidden');
            mudarAdminTab(tab);
        }

        function fecharAdmin() {
            document.getElementById('modal-admin').classList.add('hidden');
            syncBrandText();
            if (!document.getElementById('view-onboarding').classList.contains('hidden')) renderOnboarding();
            else renderAppTab();
        }

        function mudarAdminTab(t) {
            STATE.adminTab = t;
            ['ex', 'ob', 'media', 'push', 'play'].forEach(k => {
                const el = document.getElementById('admt-' + k);
                if (el) el.className = k === t ? 'flex-1 px-2 py-2 rounded-xl text-[10px] font-bold bg-neon text-black whitespace-nowrap' : 'flex-1 px-2 py-2 rounded-xl text-[10px] font-bold surface-card-2 text-gray-300 whitespace-nowrap';
            });
            renderAdmin();
        }

        function lerMidia(input, cb) {
            const f = input.files && input.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = e => cb(e.target.result, f.type.startsWith('video/') ? 'video' : 'image');
            r.readAsDataURL(f);
        }

        function renderAdmin() {
            const box = document.getElementById('admin-body');
            if (STATE.adminTab === 'ex') {
                box.innerHTML = `
                    <div class="surface-card border-neon-soft rounded-2xl p-4 space-y-2.5">
                        <p class="text-xs font-black text-neon uppercase">+ Novo Exercício (GIF / Vídeo / Foto)</p>
                        <input id="adm-n" placeholder="Nome do exercício" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="adm-m" class="px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs">${['Peito','Costas','Ombros','Braços','Pernas','Glúteos','Abdômen'].map(m=>`<option>${m}</option>`).join('')}</select>
                            <input id="adm-w" type="number" value="20" placeholder="Carga base kg" class="px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs">
                        </div>
                        <input id="adm-f" type="file" accept="image/*,video/*" class="w-full text-[11px] text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-neon file:text-black file:font-bold">
                        <button onclick="adminCriarEx()" class="w-full py-2.5 rounded-xl neon-btn font-black text-xs">ADICIONAR EXERCÍCIO</button>
                    </div>
                    <div class="space-y-2">
                        ${STATE.exercises.map(ex => `
                            <div class="surface-card rounded-2xl p-2.5 flex items-center gap-3">
                                ${renderExMedia(ex, 'w-12 h-12')}
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs font-bold truncate">${ex.name}</p>
                                    <p class="text-[10px] text-gray-400">${ex.region} • ${ex.equip}</p>
                                    <label class="inline-block mt-1 px-2.5 py-1 rounded-lg bg-neon-soft text-neon text-[10px] font-bold cursor-pointer">📤 Enviar GIF/Foto<input type="file" accept="image/*,video/*" onchange="lerMidia(this,(u,t)=>{ const e=STATE.exercises.find(x=>x.id==='${ex.id}'); e.customMedia=u; e.mediaType=t; gerarPlanoPersonalizado(); renderAdmin(); mostrarToast('GIF atualizado!'); })" class="hidden"></label>
                                </div>
                            </div>
                        `).join('')}
                    </div>`;
            } else if (STATE.adminTab === 'ob') {
                const cfg = STATE.onboardingConfig;
                const renderUploadRow = (label, mapKey, itemKey) => `
                    <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl surface-card-2 text-xs">
                        <div class="flex items-center gap-2 min-w-0">
                            ${cfg[mapKey][itemKey] ? `<img src="${cfg[mapKey][itemKey]}" class="w-8 h-8 rounded-lg object-cover">` : `<span class="w-8 h-8 rounded-lg bg-black/40 flex items-center justify-center text-[10px] text-gray-400">IMG</span>`}
                            <span class="truncate font-semibold">${label}</span>
                        </div>
                        <label class="px-2.5 py-1 rounded-lg bg-neon text-black font-black text-[10px] cursor-pointer flex-shrink-0">Alterar<input type="file" accept="image/*" onchange="lerMidia(this,u=>{ STATE.onboardingConfig['${mapKey}']['${itemKey}']=u; renderAdmin(); mostrarToast('${label} atualizado!'); })" class="hidden"></label>
                    </div>`;

                box.innerHTML = `
                    <div class="surface-card rounded-2xl p-3.5 space-y-2">
                        <p class="text-xs font-black text-neon uppercase">1. Fotos — Objetivo Atual</p>
                        ${Object.keys(cfg.goalImages).map(k => renderUploadRow(k, 'goalImages', k)).join('')}
                    </div>
                    <div class="surface-card rounded-2xl p-3.5 space-y-2">
                        <p class="text-xs font-black text-neon uppercase">2. Fotos — Experiência de Treino</p>
                        ${Object.keys(cfg.experienceImages).map(k => renderUploadRow(k, 'experienceImages', k)).join('')}
                    </div>
                    <div class="surface-card rounded-2xl p-3.5 space-y-2">
                        <p class="text-xs font-black text-neon uppercase">3. Fotos — Frequência de Treino</p>
                        ${Object.keys(cfg.frequencyImages).map(k => renderUploadRow(k, 'frequencyImages', k)).join('')}
                    </div>
                    <div class="surface-card rounded-2xl p-3.5 space-y-2">
                        <p class="text-xs font-black text-neon uppercase">4. Fotos — Onde Você Treina</p>
                        ${Object.keys(cfg.locationImages).map(k => renderUploadRow(k, 'locationImages', k)).join('')}
                    </div>
                    <div class="surface-card rounded-2xl p-3.5 space-y-2">
                        <p class="text-xs font-black text-neon uppercase">5. GIFs / Fotos — Lesões Ativas</p>
                        ${Object.keys(cfg.injuryMedia).map(k => `
                            <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl surface-card-2 text-xs">
                                <span class="font-semibold">${k} ${cfg.injuryMedia[k].url ? '✓' : ''}</span>
                                <label class="px-2.5 py-1 rounded-lg bg-neon text-black font-black text-[10px] cursor-pointer">Enviar GIF/Foto<input type="file" accept="image/*,video/*" onchange="lerMidia(this,(u,t)=>{ STATE.onboardingConfig.injuryMedia['${k}']={url:u,type:t}; renderAdmin(); mostrarToast('Lesão ${k} atualizada!'); })" class="hidden"></label>
                            </div>`).join('')}
                    </div>
                    <div class="surface-card rounded-2xl p-3.5 space-y-2">
                        <p class="text-xs font-black text-neon uppercase">6. Fotos — Tela Parabéns (Treino 1 a 4)</p>
                        ${cfg.communityCards.map((c, idx) => `
                            <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl surface-card-2 text-xs">
                                <div class="flex items-center gap-2"><img src="${c.img}" class="w-9 h-9 rounded-lg object-cover"><span class="font-bold">${c.label}</span></div>
                                <label class="px-2.5 py-1 rounded-lg bg-neon text-black font-black text-[10px] cursor-pointer">Trocar Foto<input type="file" accept="image/*" onchange="lerMidia(this,u=>{ STATE.onboardingConfig.communityCards[${idx}].img=u; renderAdmin(); mostrarToast('${c.label} atualizado!'); })" class="hidden"></label>
                            </div>`).join('')}
                    </div>
                    <div class="surface-card rounded-2xl p-3.5 space-y-2.5">
                        <p class="text-xs font-black text-neon uppercase">7. Benefícios & Marcas Parceiras</p>
                        <label class="block text-[10px] text-gray-400">Frase da seção:</label>
                        <input value="${cfg.benefitsTitle}" oninput="STATE.onboardingConfig.benefitsTitle=this.value" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs">
                        ${cfg.partnerBrands.map((b, idx) => `
                            <div class="flex items-center gap-2 p-2 rounded-xl surface-card-2 text-xs">
                                ${b.img ? `<img src="${b.img}" class="w-7 h-7 rounded-full object-cover">` : `<span class="w-7 h-7 rounded-full bg-black/40 flex items-center justify-center text-[9px] text-gray-400">LOGO</span>`}
                                <input value="${b.name}" oninput="STATE.onboardingConfig.partnerBrands[${idx}].name=this.value" class="flex-1 bg-transparent text-xs font-bold outline-none">
                                <label class="px-2 py-1 rounded-lg bg-neon text-black font-black text-[10px] cursor-pointer">Foto<input type="file" accept="image/*" onchange="lerMidia(this,u=>{ STATE.onboardingConfig.partnerBrands[${idx}].img=u; renderAdmin(); mostrarToast('Logo ${b.name} salva!'); })" class="hidden"></label>
                            </div>`).join('')}
                    </div>`;
            } else if (STATE.adminTab === 'media') {
                box.innerHTML = `
                    <div class="surface-card border-neon-soft rounded-2xl p-4 space-y-2.5">
                        <p class="text-xs font-black text-neon uppercase">⭐ Nota, Estrelas e Avaliações</p>
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="text-[10px] text-gray-400">Nota (ex: 4,9)</label><input value="${STATE.socialProof.rating}" oninput="STATE.socialProof.rating=this.value" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs mt-1"></div>
                            <div><label class="text-[10px] text-gray-400">Estrelas (1 a 5)</label><input type="number" min="1" max="5" value="${STATE.socialProof.stars}" oninput="STATE.socialProof.stars=Math.max(1,Math.min(5,+this.value||5))" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs mt-1"></div>
                        </div>
                        <div><label class="text-[10px] text-gray-400">Texto completo (+34 mil avaliações no app)</label><input value="${STATE.socialProof.reviewsText}" oninput="STATE.socialProof.reviewsText=this.value; STATE.socialProof.shortReviews=this.value.replace(' no app','').replace('+','');" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs mt-1"></div>
                    </div>

                    <div class="surface-card rounded-2xl p-4 space-y-3">
                        <p class="text-xs font-black text-neon uppercase">📸 Fotos Antes & Depois (Todos os Slides)</p>
                        ${STATE.media.beforeAfter.map((ba, idx) => `
                            <div class="p-3 rounded-xl surface-card-2 space-y-2">
                                <p class="text-xs font-bold text-white">Slide ${idx+1}: ${ba.author} (${ba.title})</p>
                                <div class="grid grid-cols-2 gap-2">
                                    <label class="p-2 rounded-lg bg-black/40 text-center text-[10px] font-bold cursor-pointer">📷 Trocar ANTES<input type="file" accept="image/*" onchange="lerMidia(this,u=>{ STATE.media.beforeAfter[${idx}].before=u; renderAdmin(); mostrarToast('Antes ${idx+1} salvo!'); })" class="hidden"></label>
                                    <label class="p-2 rounded-lg bg-neon-soft text-neon text-center text-[10px] font-bold cursor-pointer">🔥 Trocar DEPOIS<input type="file" accept="image/*" onchange="lerMidia(this,u=>{ STATE.media.beforeAfter[${idx}].after=u; renderAdmin(); mostrarToast('Depois ${idx+1} salvo!'); })" class="hidden"></label>
                                </div>
                            </div>
                        `).join('')}
                        <label class="block p-3 rounded-xl surface-card-2 text-xs cursor-pointer">👤 Trocar Foto de Perfil<input type="file" accept="image/*" onchange="lerMidia(this,u=>{ STATE.media.profileAvatar=u; mostrarToast('Avatar salvo!'); })" class="hidden"></label>
                        <label class="block p-3 rounded-xl surface-card-2 text-xs cursor-pointer">🏋️ Capa Treino Destaque 1<input type="file" accept="image/*" onchange="lerMidia(this,u=>{ STATE.media.covers[0].img=u; mostrarToast('Capa salva!'); })" class="hidden"></label>
                    </div>`;
            } else if (STATE.adminTab === 'push') {
                box.innerHTML = `
                    <div class="surface-card rounded-2xl p-4 space-y-3">
                        <p class="text-xs font-black text-neon uppercase">🔔 Notificação Push com Imagem</p>
                        <input value="${STATE.promo.title}" oninput="STATE.promo.title=this.value" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs">
                        <textarea rows="2" oninput="STATE.promo.body=this.value" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs">${STATE.promo.body}</textarea>
                        <input type="file" accept="image/*" onchange="lerMidia(this,u=>{ STATE.promo.img=u; document.getElementById('promo-mini-img').src=u; document.getElementById('promo-mini-img').classList.remove('hidden'); document.getElementById('promo-mini-emoji').classList.add('hidden'); mostrarToast('Imagem do Push salva!'); })" class="w-full text-[11px] text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-neon file:text-black file:font-bold">
                        <button onclick="fecharAdmin(); setTimeout(dispararPush, 250);" class="w-full py-3 rounded-xl neon-btn font-black text-xs">🔔 DISPARAR PUSH AGORA</button>
                    </div>`;
            } else {
                box.innerHTML = `
                    <div class="surface-card border-neon-soft rounded-2xl p-4 space-y-3">
                        <p class="text-xs font-black text-neon uppercase">🎟️ Criar Cupom Promocional</p>
                        <input id="new-cp-code" placeholder="Código (ex: PROMO50)" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs uppercase">
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="text-[10px] text-gray-400">Desconto (%)</label><input id="new-cp-pct" type="number" min="1" max="80" value="30" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs mt-1"></div>
                            <div><label class="text-[10px] text-gray-400">Limite de usos (máx 100)</label><input id="new-cp-max" type="number" min="1" max="100" value="100" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs mt-1"></div>
                        </div>
                        <button onclick="adminCriarCupom()" class="w-full py-2.5 rounded-xl neon-btn font-black text-xs">+ CRIAR CUPOM</button>
                        <div class="space-y-1.5 pt-1">
                            ${STATE.billing.coupons.map((cp, idx) => `
                                <div class="flex items-center justify-between p-2.5 rounded-xl surface-card-2 text-xs">
                                    <div><strong class="text-neon">${cp.code}</strong> <span class="text-white">-${cp.pct}%</span><p class="text-[10px] text-gray-400">Usados: ${cp.used} / ${cp.maxUses}</p></div>
                                    <button onclick="STATE.billing.coupons.splice(${idx},1); renderAdmin(); mostrarToast('Cupom removido');" class="px-2 py-1 rounded-lg bg-red-500/20 text-red-400 text-[10px] font-bold">Excluir</button>
                                </div>`).join('')}
                        </div>
                    </div>

                    <div class="surface-card rounded-2xl p-4 space-y-3">
                        <p class="text-xs font-black text-neon uppercase">💰 Preços Google Play & Indicação</p>
                        <input value="${STATE.brandName}" oninput="STATE.brandName=this.value" placeholder="Nome do App" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs">
                        <input value="${STATE.referral.playUrl}" oninput="STATE.referral.playUrl=this.value" placeholder="URL Play Store" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs">
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="text-[10px] text-gray-400">Anual À Vista (R$)</label><input type="number" step="0.1" value="${STATE.billing.annualCash}" oninput="STATE.billing.annualCash=+this.value||179.9; STATE.billing.annualEq=+(STATE.billing.annualCash/12).toFixed(2);" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs mt-1"></div>
                            <div><label class="text-[10px] text-gray-400">Anual 12x (parcela R$)</label><input type="number" step="0.1" value="${STATE.billing.annualInst}" oninput="STATE.billing.annualInst=+this.value||19.99" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs mt-1"></div>
                        </div>
                        <button onclick="alternarTema()" class="w-full py-2.5 rounded-xl surface-card-2 text-neon font-black text-xs border border-neon-soft">🎨 Trocar Cor (Laranja / Verde Neon)</button>
                    </div>`;
            }
        }

        function adminCriarCupom() {
            const code = (document.getElementById('new-cp-code')?.value || '').trim().toUpperCase();
            const pct = Math.max(1, Math.min(80, +(document.getElementById('new-cp-pct')?.value || 20)));
            const maxUses = Math.max(1, Math.min(100, +(document.getElementById('new-cp-max')?.value || 100)));
            if (!code) return mostrarToast('Digite o código do cupom!');
            const ex = STATE.billing.coupons.find(c => c.code === code);
            if (ex) { ex.pct = pct; ex.maxUses = maxUses; }
            else STATE.billing.coupons.unshift({ code, pct, maxUses, used: 0 });
            renderAdmin();
            mostrarToast(`Cupom ${code} (-${pct}%, máx ${maxUses} usos) criado! 🎟️`);
        }

        function adminCriarEx() {
            const name = document.getElementById('adm-n').value.trim();
            if (!name) return mostrarToast('Digite o nome!');
            const region = document.getElementById('adm-m').value;
            const baseWeight = +(document.getElementById('adm-w')?.value || 20);
            const f = document.getElementById('adm-f');
            const grp = ['Peito', 'Ombros'].includes(region) ? 'empurrar' : (['Costas', 'Braços'].includes(region) ? 'puxar' : (region === 'Abdômen' ? 'core' : 'perna'));
            const save = (u = '', t = 'image') => {
                STATE.exercises.unshift({ id: 'ex' + Date.now(), region, muscle: region, injuryKeys: [region], group: grp, equip: 'Personalizado', locs: ['Academia Comercial', 'Academia Pequena', 'Academia em Casa', 'Peso Corporal'], baseWeight, anim: 'curl', name, customMedia: u, mediaType: t, fav: false });
                gerarPlanoPersonalizado();
                renderAdmin();
                mostrarToast('Exercício adicionado ao plano! 🔥');
            };
            if (f.files && f.files[0]) lerMidia(f, save); else save();
        }

        // Cronômetro da barra promocional
        setInterval(() => {
            if (STATE.promo.countdown > 0) STATE.promo.countdown--;
            const h = String(Math.floor(STATE.promo.countdown / 3600)).padStart(2, '0');
            const m = String(Math.floor((STATE.promo.countdown % 3600) / 60)).padStart(2, '0');
            const s = String(STATE.promo.countdown % 60).padStart(2, '0');
            const el = document.getElementById('promo-timer');
            if (el) el.textContent = `${h}:${m}:${s}`;
        }, 1000);

        // Inicialização
        window.onload = function () {
            gerarPlanoPersonalizado();
            irParaOnboarding(0);
        };
    </script>
</body>
</html>
