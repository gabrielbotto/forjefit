name: Build Android APK (Capacitor)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar WebDir e Capacitor Android
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js src www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.webDir='www';fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: ForjeFit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
